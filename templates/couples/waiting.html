{% extends "base.html" %}
{% block title %}En attente — K'er{% endblock %}
{% block content %}
<section class="flex-1 flex flex-col items-center justify-center text-center gap-8 animate-fade-in"
         x-data="{
           code: '{{ room_code }}',
           autoRedirecting: false,
           init() {
             const alreadyReady = {{ couple.is_complete|yesno:'true,false' }};
             if (alreadyReady) {
               this.redirectToDashboard();
               return;
             }
             this.checkStatus();
             setInterval(() => this.checkStatus(), 2000);
           },
           async checkStatus() {
             if (this.autoRedirecting) return;
             try {
               const response = await fetch(`/couples/waiting/${this.code}/status/`);
               const data = await response.json();
               if (data.ready) {
                 this.redirectToDashboard();
               }
             } catch (e) {
               console.warn('waiting status check failed', e);
             }
           },
           redirectToDashboard() {
             this.autoRedirecting = true;
             window.location.href = '{% url "couples:dashboard" %}';
           }
         }">
  <div class="sync-orbs">
    <span class="sync-orbs__dot sync-orbs__dot--a"></span>
    <span class="sync-orbs__line"></span>
    <span class="sync-orbs__dot sync-orbs__dot--b"></span>
  </div>
  <div>
    <h1 class="text-xl font-semibold text-white/90">En attente de votre moitié</h1>
    <p class="text-white/50 mt-2 text-sm">Partagez ce code magique</p>
  </div>
  <p class="text-4xl font-bold tracking-[0.2em] text-transparent bg-clip-text bg-gradient-to-r from-love-soft via-white to-premium-soft"
     x-text="code"></p>
  <p class="text-xs text-white/35 uppercase tracking-widest">Connexion automatique</p>
  <p class="text-sm text-white/50" x-show="!autoRedirecting">La room se lance automatiquement dès que votre partenaire a rejoint.</p>
</section>
{% endblock %}
