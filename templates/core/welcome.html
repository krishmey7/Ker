{% extends "base.html" %}
{% block title %}K'er — Rituel de couple{% endblock %}
{% block content %}
<section class="flex-1 flex flex-col items-center justify-center text-center gap-10 animate-fade-in">
  <div class="hero-heart">
    <span class="hero-heart__ring"></span>
    <span class="hero-heart__ring"></span>
    <div class="hero-heart__core">
      {% include "partials/icon.html" with name="heart" class="icon" %}
    </div>
  </div>
  <div>
    <h1 class="font-display text-5xl font-semibold tracking-tight bg-gradient-to-br from-love-soft via-white to-premium-soft bg-clip-text text-transparent">
      K'er
    </h1>
    <p class="mt-4 text-white/65 text-lg leading-relaxed max-w-xs mx-auto">
      Répondez séparément.<br>
      <span class="text-love-soft">Révélez ensemble.</span><br>
      Reconnectez-vous chaque jour.
    </p>
  </div>
  <div class="w-full space-y-3">
    <a href="{% url 'users:onboarding' %}" class="btn-primary w-full">Commencer l'aventure</a>
    <a href="{% url 'users:login' %}" class="btn-ghost w-full">J'ai déjà un compte</a>
  </div>
</section>
{% endblock %}
